name: Code Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM
  workflow_dispatch:
    inputs:
      fail_on:
        description: 'Fail threshold'
        required: false
        default: 'critical'
        type: choice
        options: [critical, high, medium, low, none]

jobs:
  code-analysis:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      security-events: write  # For SARIF upload
      pull-requests: write    # For PR comments
      checks: write           # For check runs
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history analysis
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r pro/requirements.txt
      
      - name: Run code analysis
        id: analysis
        run: |
          python -m pro.cli analyze . \
            --format sarif \
            -o results.sarif \
            --fail-on ${{ github.event.inputs.fail_on || 'critical' }}
      
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: code-analysis-agent
      
      - name: Generate Markdown Report
        run: |
          python -m pro.cli analyze . \
            --format markdown \
            -o report.md
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            
            const body = `## 🔍 Code Analysis Report\n\n${report}\n\n---\n*Generated by [Code Analysis Agent](https://github.com/your-org/code-analysis-agent)*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Upload Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analysis-reports
          path: |
            results.sarif
            report.md
          retention-days: 30
      
      - name: Check for Regressions
        if: github.event_name == 'pull_request'
        run: |
          # Create baseline from main branch
          git fetch origin main:main
          python -m pro.cli analyze . \
            --format json \
            -o current.json
          
          # Compare with baseline if exists
          if [ -f ".code_analysis_baseline.json" ]; then
            python -m pro.cli regress . \
              --baseline .code_analysis_baseline.json \
              --threshold 5.0
          else
            echo "No baseline found, creating one..."
            cp current.json .code_analysis_baseline.json
          fi
      
      - name: Update Baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python -m pro.cli analyze . \
            --format json \
            -o .code_analysis_baseline.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .code_analysis_baseline.json
          git commit -m "chore: update code analysis baseline" || true
          git push || true

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r pro/requirements.txt
      - name: Run benchmarks
        run: |
          python -m pro.cli benchmark test_repos/good_repo test_repos/bad_repo \
            --iterations 5 \
            -o benchmark_results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
      - name: Compare with previous
        run: |
          if [ -f "previous_benchmark.json" ]; then
            python -m pro.benchmarks.runner compare previous_benchmark.json benchmark_results.json
          fi
          cp benchmark_results.json previous_benchmark.json

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r pro/requirements.txt
      - name: Generate CycloneDX SBOM
        run: |
          python -m pro.sbom . \
            --format cyclonedx-json \
            -o sbom.cyclonedx.json
      - name: Generate SPDX SBOM
        run: |
          python -m pro.sbom . \
            --format spdx-json \
            -o sbom.spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
      - name: Upload to Dependency Track (optional)
        if: env.DEPENDENCY_TRACK_URL != ''
        run: |
          curl -X PUT "${{ env.DEPENDENCY_TRACK_URL }}/api/v1/bom" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ env.DEPENDENCY_TRACK_API_KEY }}" \
            -d @sbom.cyclonedx.json

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        if: env.DOCKER_HUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.DOCKER_HUB_USERNAME != '' }}
          tags: your-org/code-analysis-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max